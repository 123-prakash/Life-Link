<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LifeLink | My Profile</title>
<link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/profile.css">
   

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div id="navbar"></div>


<div class="profile-container">

    <div class="profile-card">

       <img
id="profileImage"
src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
class="profile-img"
alt="Profile">

<input
type="file"
id="imageInput"
accept="image/*"
hidden>

<button id="uploadBtn">
    <i class="fa-solid fa-camera"></i>
    Change Photo
</button> 
<button id="removeBtn">
    <i class="fa-solid fa-trash"></i>
    Remove Photo
</button>
        <h2>My Profile</h2>

        <div class="info">

            <p><i class="fa-solid fa-user"></i> <span id="userName">Loading...</span></p>

            <p><i class="fa-solid fa-envelope"></i> <span id="userEmail">Loading...</span></p>

            <p><i class="fa-solid fa-phone"></i> <span id="userPhone">Loading...</span></p>

            <p><i class="fa-solid fa-droplet"></i> <span id="userBlood">Loading...</span></p>

            <p><i class="fa-solid fa-location-dot"></i> <span id="userCity">Loading...</span></p>

        </div>

        <button id="backBtn">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Dashboard
        </button>

        <button id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>

    </div>

</div>

<script type="module" src="navbar.js"></script>
<script type="module" src="profile.js"></script>

</body>
</html>
