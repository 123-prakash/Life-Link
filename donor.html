<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LifeLink | Become a Donor</title>

<link rel="stylesheet" href="css/donor.css">
<link rel="stylesheet" href="css/navbar.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>
<div id="navbar"></div>

<div class="donor-container">


<div class="donor-card">


<div class="heading">

<i class="fa-solid fa-droplet"></i>

<h1>Become a Blood Donor ❤️</h1>

<p>
Your one registration can save someone's life.
</p>

</div>



<form id="donorForm">


<div class="input-box">

<i class="fa-solid fa-user"></i>

<input 
type="text"
id="name"
placeholder="Full Name"
required>

</div>



<div class="input-box">

<i class="fa-solid fa-calendar"></i>

<input
type="number"
id="age"
placeholder="Age"
required>

</div>



<div class="input-box">

<i class="fa-solid fa-venus-mars"></i>

<select id="gender" required>

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>




<div class="input-box">

<i class="fa-solid fa-droplet"></i>

<select id="bloodGroup" required>

<option value="">Select Blood Group</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>




<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

</div>




<div class="input-box">

<i class="fa-solid fa-location-dot"></i>

<input
type="text"
id="city"
placeholder="City"
required>

</div>




<div class="input-box">

<i class="fa-solid fa-house"></i>

<textarea
id="address"
placeholder="Address"
required></textarea>

</div>




<button type="submit">

Register as Donor

</button>


</form>


</div>


</div>

<script type="module" src="navbar.js"></script>
<script type="module" src="donor.js"></script>


</body>

</html>
