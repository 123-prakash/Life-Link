<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LifeLink | Register</title>

    <link rel="stylesheet" href="css/register.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="left">

        <h1>LifeLink</h1>

        <h2>Donate Blood, Save Lives ❤️</h2>

        <p>
            Join our blood donor community and help save lives by becoming a registered donor.
        </p>

    </div>

    <div class="right">

        <form id="registerForm">

            <h2>Create Account</h2>
                        <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                type="text"
                id="name"
                placeholder="Full Name"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                id="email"
                placeholder="Email Address"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="password"
                placeholder="Password"
                required>

                <span id="togglePassword">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required>

                <span id="toggleConfirmPassword">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>
                        <button type="submit">

                Register

            </button>

            <p class="login-link">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </form>

    </div>

</div>

<script type="module" src="auth.js"></script>

</body>

</html>d
